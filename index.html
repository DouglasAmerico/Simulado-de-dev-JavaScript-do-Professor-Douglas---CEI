<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Simulador Douglas - CEI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <style>
        :root {
            --bg-terminal: #000000;
            --header-blue: #007acc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; background: #121212; overflow: hidden; }

        header { background: var(--header-blue); color: white; padding: 12px; text-align: center; font-size: 1.2rem; font-weight: bold; z-index: 10; }

        main { display: flex; flex: 1; padding: 10px; gap: 10px; background: #000; }

        /* Lado Esquerdo: Terminal Simples */
        #terminal-container { flex: 1; display: flex; flex-direction: column; background: var(--bg-terminal); border: 1px solid #333; border-radius: 4px; }
        #terminal-label { background: #1e1e1e; color: #aaa; padding: 5px 15px; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #333; }
        #terminal-output { flex: 1; padding: 15px; color: #00ff00; font-family: 'Consolas', 'Courier New', monospace; overflow-y: auto; white-space: pre-wrap; font-size: 14px; }
        #terminal-input-line { display: none; padding: 10px; background: #0a0a0a; border-top: 1px solid #222; align-items: center; }
        #terminal-input-line label { color: #00ff00; margin-right: 8px; font-family: monospace; }
        #terminal-input { background: transparent; border: none; color: white; flex: 1; outline: none; font-family: monospace; font-size: 14px; }

        /* Lado Direito: Editor Completo */
        #editor-container { flex: 1; display: flex; flex-direction: column; background: #1e1e1e; border: 1px solid #333; border-radius: 4px; overflow: hidden; }
        #editor-label { background: #2d2d2d; color: #fff; padding: 5px 15px; font-size: 11px; text-transform: uppercase; }
        #monaco-editor-instance { flex: 1; width: 100%; }

        /* Rodapé com Botão */
        #controls { padding: 10px; background: #252526; text-align: right; }
        .btn-run { background: #28a745; color: white; border: none; padding: 10px 30px; border-radius: 2px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-run:hover { background: #218838; }
    </style>
</head>
<body>

<header>Simulado de dev JavaScript do Professor Douglas - CEI</header>

<main>
    <section id="terminal-container">
        <div id="terminal-label">Terminal de Saída</div>
        <div id="terminal-output">Pronto para rodar código JavaScript.</div>
        <div id="terminal-input-line">
            <label>></label>
            <input type="text" id="terminal-input" autocomplete="off">
        </div>
    </section>

    <section id="editor-container">
        <div id="editor-label">index.js</div>
        <div id="monaco-editor-instance"></div>
        <div id="controls">
            <button class="btn-run" onclick="executeCode()">Executar</button>
        </div>
    </section>
</main>

<script>
    let editor;
    const terminal = document.getElementById('terminal-output');
    const inputLine = document.getElementById('terminal-input-line');
    const terminalInput = document.getElementById('terminal-input');
    let inputResolver = null;

    // Inicialização do Monaco Editor
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
    require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('monaco-editor-instance'), {
            value: [
                'const prompt = require("prompt-sync")();',
                '',
                'let n1 = Number(prompt("Digite o primeiro número: "));',
                'let n2 = Number(prompt("Digite o segundo número: "));',
                '',
                'console.log("A soma é: " + (n1 + n2));',
                '',
                '//Use o codigo acima como exemplo ou apague tudo e escreva seu próprio código JavaScript aqui!'
            ].join('\n'),
            language: 'javascript',
            theme: 'vs-dark',
            automaticLayout: true,
            fontSize: 15,
            minimap: { enabled: false },
            suggestOnTriggerCharacters: true,
            scrollBeyondLastLine: false,
        });
    });

    // Simulação do Prompt interativo no Terminal
    async function internalPrompt(msg) {
        terminal.innerHTML += msg;
        terminal.scrollTop = terminal.scrollHeight;
        inputLine.style.display = 'flex';
        terminalInput.focus();
        return new Promise(res => inputResolver = res);
    }

    terminalInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const val = terminalInput.value;
            terminal.innerHTML += val + "\n";
            terminalInput.value = '';
            inputLine.style.display = 'none';
            if (inputResolver) inputResolver(val);
        }
    });

    // Console.log redirecionado
    const customConsole = {
        log: (...args) => {
            terminal.innerHTML += args.join(' ') + "\n";
            terminal.scrollTop = terminal.scrollHeight;
        }
    };

    // Execução do Código
    async function executeCode() {
        if (!editor) return;
        
        const rawCode = editor.getValue();
        terminal.innerHTML = "[Iniciando execução...]\n";
        
        // Ajuste para permitir o require e o prompt de forma assíncrona
        let processed = rawCode
            .replace(/require\(['"]prompt-sync['"]\)\(\)/g, "internalPrompt")
            .replace(/prompt\(/g, "await internalPrompt(");

        try {
            const AsyncFunc = Object.getPrototypeOf(async function(){}).constructor;
            const run = new AsyncFunc('internalPrompt', 'console', processed);
            await run(internalPrompt, customConsole);
            terminal.innerHTML += "\n[Execução finalizada]";
        } catch (err) {
            terminal.innerHTML += "\n<span style='color:#ff5555'>[Erro]: " + err.message + "</span>";
        }
    }
</script>

</body>
</html>
